# 启程智远 · OA-HRM PoC 网关（占位）
# 后端/前端上线后在此补 upstream 与 location。
server {
    listen 80;
    server_name _;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        default_type text/plain;
        return 200 "QCZY-POC gateway ready. HRM backend/frontend pending.\n";
    }
}
